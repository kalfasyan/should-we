[project]
name = "should-we"
version = "0.1.0"
description = "Generic weighted ranking — rank options (homes, cars, vacations) when multiple people need to agree."
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "nicegui",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

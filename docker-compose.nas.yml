# Paste this into Synology Container Manager > Project > Create.
# Data lives in /volume1/docker/should-we/data on the NAS; secrets in
# /volume1/docker/should-we/.env (see docs/nas.md).
services:
  should-we:
    image: ghcr.io/kalfasyan/should-we:latest
    container_name: should-we
    restart: always
    ports:
      - "127.0.0.1:8080:8080" # only reachable through DSM's reverse proxy
    volumes:
      - /volume1/docker/should-we/data:/app/data
    env_file: .env # SHOULD_WE_ADMINS, SHOULD_WE_STORAGE_SECRET
    environment:
      - TZ=Europe/Brussels
      - FORWARDED_ALLOW_IPS=* # trust DSM's X-Forwarded-Proto; the port is localhost-only
      - NICEGUI_STORAGE_PATH=/app/data/.nicegui # keep logins across updates
    mem_limit: 384m
